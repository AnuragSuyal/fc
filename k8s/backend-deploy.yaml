apiVersion: apps/v1
kind: Deployment
metadata:
  name: friend-circle-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: friend-circle-api
  template:
    metadata:
      labels:
        app: friend-circle-api
    spec:
      containers:
      - name: api
        image: friend-circle-registry/backend:latest
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: friend-circle-secrets
        - configMapRef:
            name: friend-circle-config
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: friend-circle-api
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: room-service
spec:
  selector:
    app: friend-circle-api
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: socket-cluster
spec:
  selector:
    app: friend-circle-api
  ports:
  - port: 80
    targetPort: 5000
  sessionAffinity: ClientIP # Important for Socket.IO






