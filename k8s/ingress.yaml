apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: friend-circle-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "socket-cluster"
spec:
  tls:
  - hosts:
    - api.friendcircle.app
    secretName: friend-circle-tls
  rules:
  - host: api.friendcircle.app
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /api/rooms
        pathType: Prefix
        backend:
          service:
            name: room-service
            port:
              number: 80
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: socket-cluster
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80






